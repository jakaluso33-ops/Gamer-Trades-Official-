name: Deploy GamerTrades to GitHub Pages

on:
  push:
    branches:
      - main
      - claude/vigilant-hopper-9lmcyr
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: gamer-trades/package-lock.json

      - name: Install dependencies
        working-directory: gamer-trades
        run: npm ci

      - name: Build static export
        working-directory: gamer-trades
        run: npm run build
        env:
          NODE_ENV: production
          NEXT_PUBLIC_SUPABASE_URL: https://gtpgaarroytjaseuqvbf.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imd0cGdhYXJyb3l0amFzZXVxdmJmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODUyMDQyODYsImV4cCI6MjEwMDc4MDI4Nn0.ampPVpgo1hYwOYCmQLPKdbAnRa8EB5WRoo4vBU5Tpjc

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: gamer-trades/out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
