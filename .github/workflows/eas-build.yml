name: EAS Build (mobile)

on:
  workflow_dispatch:
    inputs:
      platform:
        description: "Platform to build"
        required: true
        default: "android"
        type: choice
        options:
          - android
          - ios
          - all
      profile:
        description: "EAS build profile (see gamer-trades-mobile/eas.json)"
        required: true
        default: "preview"
        type: choice
        options:
          - development
          - preview
          - production
      local:
        description: "Build locally on the runner instead of on EAS servers (diagnostic — surfaces full Gradle output in this log)"
        required: false
        default: false
        type: boolean

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gamer-trades-mobile
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      EXPO_ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      EXPO_ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Check EXPO_TOKEN secret is set
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "::error::EXPO_TOKEN secret is empty or not set. Add it under Settings > Secrets and variables > Actions."
            exit 1
          fi
          echo "EXPO_TOKEN is set (length: ${#EXPO_TOKEN})"

      - name: Write App Store Connect API key (iOS only)
        if: ${{ inputs.platform == 'ios' || inputs.platform == 'all' }}
        run: |
          if [ -z "${{ secrets.ASC_API_KEY_P8 }}" ]; then
            echo "::error::ASC_API_KEY_P8 secret is empty or not set. Add it under Settings > Secrets and variables > Actions."
            exit 1
          fi
          echo "${{ secrets.ASC_API_KEY_P8 }}" > AuthKey.p8
          echo "EXPO_ASC_API_KEY_PATH=$(pwd)/AuthKey.p8" >> "$GITHUB_ENV"

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: gamer-trades-mobile/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Init EAS project (idempotent)
        run: eas init --non-interactive --force

      - name: Set up JDK
        if: ${{ inputs.local }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Build (local diagnostic)
        if: ${{ inputs.local }}
        run: eas build --platform ${{ inputs.platform }} --profile ${{ inputs.profile }} --local --non-interactive --output ./build-output

      - name: Build on EAS
        if: ${{ !inputs.local }}
        run: eas build --platform ${{ inputs.platform }} --profile ${{ inputs.profile }} --non-interactive
